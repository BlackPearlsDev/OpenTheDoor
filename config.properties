# OpenTheDoor configuration

# Modes:
# auto / tcp-listen  : raw TCP listener
# http-listen        : HTTP mock listener
# tcp-proxy          : TCP relay proxy with packet logging
# apk-scan           : static APK URL/domain scanner
mode=auto
host=0.0.0.0
port=8080

# tcp-proxy mode
# Client -> OpenTheDoor host:port -> targetHost:targetPort
targetHost=
targetPort=80

# http-listen mode
mockDir=mocks
defaultHttpStatus=200
defaultHttpContentType=application/json; charset=UTF-8

# logs
logDir=logs
savePackets=true
maxPrintableBytes=4096

# apk-scan mode
apkPath=game.apk
scanOutput=reports/apk-scan-report.md
